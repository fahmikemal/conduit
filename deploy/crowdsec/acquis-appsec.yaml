# /etc/crowdsec/acquis.d/appsec.yaml: the AppSec component that conduit asks per request
# (crowdsec.appsec.url). Needs: cscli collections install
#   crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
appsec_config: crowdsecurity/appsec-default
labels:
  type: appsec
listen_addr: 127.0.0.1:7422
source: appsec
